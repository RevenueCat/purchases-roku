version: 2.1

orbs:
  node: circleci/node@7.2.1
  revenuecat: revenuecat/sdks-common-config@4.1.0

executors:
  ruby-node-executor:
    docker:
      - image: cimg/ruby:3.3-node
    resource_class: small
    working_directory: ~/purchases-roku
    shell: /bin/bash --login -o pipefail

commands:
  install-yarn-dependencies:
    steps:
      - node/install:
          node-version: "24.11"
      - restore_cache:
          keys:
            - v1-yarn-cache-{{ checksum "yarn.lock" }}-{{ arch }}
      - run:
          name: Yarn install
          command: |
            corepack enable
            corepack yarn install --frozen-lockfile
      - save_cache:
          key: v1-yarn-cache-{{ checksum "yarn.lock" }}-{{ arch }}
          paths:
            - ~/.cache/yarn

jobs:
  test:
    executor:
      name: ruby-node-executor
    steps:
      - checkout
      - revenuecat/install-gem-unix-dependencies:
          cache-version: v1-ruby-3.3
      - install-yarn-dependencies
      - run:
          name: Run tests
          command: bundle exec fastlane test

workflows:
  run-tests:
    when:
      and:
        - not:
            equal: [scheduled_pipeline, << pipeline.trigger_source >>]
        - or:
            - equal: ["main", << pipeline.git.branch >>]
            - not:
                matches:
                  pattern: "^(main|release/.*)$"
                  value: << pipeline.git.branch >>
    jobs:
      - test
